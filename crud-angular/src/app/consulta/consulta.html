<div class="flex flex-row items-center justify-center">
  <div class="flex w-225 flex-col">
    <form class="mt-15 rounded-md shadow-md" #buscaForm="ngForm">
      <mat-card appearance="outlined">
        <mat-card-header>
          <mat-card-title>Consulta</mat-card-title>
        </mat-card-header>
        <mat-card-content class="mt-5">
          <div class="flex flex-row">
            <div class="flex w-200 flex-col">
              <mat-form-field class="w-full">
                <mat-label>Nome: </mat-label>
                <input matInput placeholder="Ex: Maria" />
              </mat-form-field>
            </div>
          </div>
        </mat-card-content>
        <mat-card-actions>
          <button type="submit" mat-flat-button color="primary">
            <mat-icon fontIcon="search"></mat-icon>
            Pesquisar
          </button>
        </mat-card-actions>
      </mat-card>
    </form>
  </div>
</div>
