<div class="flex flex-row items-center justify-center">
  <div class="flex w-225 flex-col">
    <form
      class="mt-15 rounded-md shadow-md"
      #buscaForm="ngForm"
      (ngSubmit)="pesquisar()"
    >
      <mat-card appearance="outlined">
        <mat-card-header>
          <mat-card-title>Consulta</mat-card-title>
        </mat-card-header>

        <mat-card-content class="mt-5">
          <div class="flex flex-row">
            <div class="flex w-200 flex-col">
              <mat-form-field class="w-full">
                <mat-label>Nome:</mat-label>
                <input
                  name="nomeBusca"
                  [(ngModel)]="nomeBusca"
                  matInput
                  placeholder="Ex: Maria"
                  ngModel
                />
              </mat-form-field>
            </div>
          </div>
        </mat-card-content>
        <mat-card-actions class="m-0! flex gap-2 px-4! pb-4!">
          <button type="submit" mat-flat-button color="primary">
            <mat-icon fontIcon="search"></mat-icon>
            Pesquisar
          </button>
        </mat-card-actions>
      </mat-card>
    </form>
  </div>
</div>
<div class="mt-5 flex flex-row items-center justify-center">
  <div class="flex w-225 flex-col rounded-md shadow-md">
    <mat-card appearance="outlined">
      <mat-card-header>
        <mat-card-title>Resultado</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <table mat-table [dataSource]="listaClientes">
          <!-- ID -->
          <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef>ID</th>
            <td mat-cell *matCellDef="let cliente">
              {{ cliente.id }}
            </td>
          </ng-container>
          <!-- Nome -->
          <ng-container matColumnDef="nome">
            <th mat-header-cell *matHeaderCellDef>Nome</th>

            <td mat-cell *matCellDef="let cliente">
              {{ cliente.nome }}
            </td>
          </ng-container>
          <!-- CPF -->
          <ng-container matColumnDef="cpf">
            <th mat-header-cell *matHeaderCellDef>CPF</th>
            <td mat-cell *matCellDef="let cliente">
              {{ cliente.cpf }}
            </td>
          </ng-container>
          <!-- Data de nascimento -->
          <ng-container matColumnDef="dataNascimento">
            <th mat-header-cell *matHeaderCellDef>Data Nascimento</th>
            <td mat-cell *matCellDef="let cliente">
              {{ cliente.dataNascimento }}
            </td>
          </ng-container>

          <!-- E-mail -->
          <ng-container matColumnDef="email">
            <th mat-header-cell *matHeaderCellDef>E-mail</th>
            <td mat-cell *matCellDef="let cliente">
              {{ cliente.email }}
            </td>
          </ng-container>

          <!-- Acoes -->
          <ng-container matColumnDef="acoes">
            <th mat-header-cell *matHeaderCellDef></th>
            <td mat-cell *matCellDef="let cliente">
              <button
                type="button"
                mat-button
                (click)="peparaEditar(cliente.id)"
              >
                <mat-icon fontIcon="edit"></mat-icon>
                Editar
              </button>

              @if (!deletando) {
                <button type="button" mat-button (click)="preparaDeletar()">
                  <mat-icon fontIcon="delete"></mat-icon>
                  Deletar
                </button>
              } @else {
                <button type="button" mat-button (click)="deletar(cliente)">
                  <mat-icon fontIcon="question_mark"></mat-icon>
                  Confirmar
                </button>
              }
            </td>
          </ng-container>

          <!-- Cabeçalho -->
          <tr mat-header-row *matHeaderRowDef="colunasTable"></tr>

          <!-- Linhas -->
          <tr mat-row *matRowDef="let cliente; columns: colunasTable"></tr>
        </table>
      </mat-card-content>
    </mat-card>
  </div>
</div>
