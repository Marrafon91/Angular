<div class="flex flex-row items-center justify-center">
  <div class="flex w-225 flex-col">
    <form class="mt-15 rounded-md shadow-md" (ngSubmit)="salvar()">
      <mat-card>
        <mat-card-header>
          <mat-card-title>Dados Pessoais</mat-card-title>
        </mat-card-header>

        <mat-card-content class="mt-5">
          <!-- NOME -->
          <div class="flex flex-row items-start gap-4">
            <div class="flex w-200 flex-col">
              <mat-form-field class="w-full">
                <mat-label>Nome: *</mat-label>

                <input
                  matInput
                  type="text"
                  [(ngModel)]="cliente.nome"
                  name="nome"
                  placeholder="Ex: Guilherme Marrafon"
                />
              </mat-form-field>
            </div>
          </div>

          <!-- EMAIL -->
          <div class="flex flex-row items-start gap-4">
            <div class="flex w-200">
              <mat-form-field class="w-full">
                <mat-label>Email: *</mat-label>

                <input
                  matInput
                  type="email"
                  [(ngModel)]="cliente.email"
                  name="email"
                  placeholder="Digite seu E-mail"
                />
              </mat-form-field>
            </div>
          </div>

          <!-- CPF / DATA -->
          <div class="flex w-100 gap-1">
            <div class="flex flex-row items-start gap-4">
              <div class="flex w-100 flex-col">
                <mat-form-field class="w-full">
                  <mat-label>CPF: *</mat-label>

                  <input
                    matInput
                    type="text"
                    [(ngModel)]="cliente.cpf"
                    name="cpf"
                    mask="000.000.000-00"
                    placeholder="Digite seu CPF"
                  />
                </mat-form-field>
              </div>
            </div>

            <div class="flex flex-row items-start gap-4">
              <div class="flex w-100 flex-col">
                <mat-form-field class="w-full">
                  <mat-label>Data de Nascimento: *</mat-label>

                  <input
                    matInput
                    type="text"
                    [(ngModel)]="cliente.dataNascimento"
                    name="dataNascimento"
                    mask="00/00/0000"
                    placeholder="Digite sua data de nascimento"
                  />
                </mat-form-field>
              </div>
            </div>
          </div>

          <!-- UF / MUNICÍPIO -->
          <div class="flex w-100 gap-1">
            <!-- UF -->
            <div class="flex flex-row items-start gap-4">
              <div class="flex w-100 flex-col">
                <mat-form-field class="w-full">
                  <mat-label>UF: *</mat-label>

                  <mat-select
                    [(ngModel)]="cliente.uf"
                    name="uf"
                    (selectionChange)="carregarMunicipios($event.value)"
                  >
                    @for (uf of estados; track uf.sigla) {
                      <mat-option [value]="uf.sigla">
                        {{ uf.sigla }}
                      </mat-option>
                    }
                  </mat-select>
                </mat-form-field>
              </div>
            </div>

            <!-- MUNICÍPIO -->
            <div class="flex flex-row items-start gap-4">
              <div class="flex w-100 flex-col">
                <mat-form-field class="w-full">
                  <mat-label>Município: *</mat-label>

                  <mat-select [(ngModel)]="cliente.municipio" name="municipio">
                    @for (m of municipios; track m.nome) {
                      <mat-option [value]="m.nome">
                        {{ m.nome }}
                      </mat-option>
                    }
                  </mat-select>
                </mat-form-field>
              </div>
            </div>
          </div>
        </mat-card-content>

        <!-- BOTÕES -->
        <mat-card-actions class="m-0! flex gap-2 px-4! pb-4!">
          @if (!atualizando) {
            <button mat-flat-button color="primary" type="submit">
              <mat-icon fontIcon="save"></mat-icon>
              Salvar
            </button>
          } @else {
            <button mat-flat-button color="primary" type="submit">
              <mat-icon fontIcon="refresh"></mat-icon>
              Atualizar
            </button>
          }

          <button
            mat-flat-button
            color="accent"
            type="button"
            (click)="limpar()"
          >
            <mat-icon fontIcon="backspace"></mat-icon>
            Limpar
          </button>
        </mat-card-actions>
      </mat-card>
    </form>
  </div>
</div>
