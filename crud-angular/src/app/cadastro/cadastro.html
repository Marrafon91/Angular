<div class="flex flex-row items-center justify-center">
  <div class="flex w-225 flex-col">
    <form class="mt-15 rounded-md shadow-md" (ngSubmit)="salvar()">
      <mat-card>
        <mat-card-header>
          <mat-card-title>Dados Pessoais</mat-card-title>
        </mat-card-header>
        <mat-card-content class="mt-5">
          <div class="flex flex-row items-start gap-4">
            <div class="flex w-200 flex-col">
              <mat-form-field class="w-full">
                <mat-label>Nome: *</mat-label>
                <input
                  type="text"
                  [(ngModel)]="client.nome"
                  name="nome"
                  placeholder="Ex: Guilherme Marrafon"
                  matInput
                />
              </mat-form-field>
            </div>
          </div>

          <div class="flex flex-row items-start gap-4">
            <div class="flex w-200">
              <mat-form-field class="w-full">
                <mat-label>Email: *</mat-label>
                <input
                  type="email"
                  [(ngModel)]="client.email"
                  name="email"
                  placeholder="Digite seu E-mail"
                  matInput
                />
              </mat-form-field>
            </div>
          </div>
          <div class="flex w-100 gap-1">
            <div class="flex flex-row items-start gap-4">
              <div class="flex w-100 flex-col">
                <mat-form-field class="w-full">
                  <mat-label>CPF: *</mat-label>
                  <input
                    type="text"
                    [(ngModel)]="client.cpf"
                    name="cpf"
                    placeholder="Digite seu CPF"
                    matInput
                  />
                </mat-form-field>
              </div>
            </div>
            <div class="flex flex-row items-start gap-4">
              <div class="flex w-100 flex-col">
                <mat-form-field class="w-full">
                  <mat-label>Data de Nascimento: *</mat-label>
                  <input
                    type="date"
                    [(ngModel)]="client.dataNascimento"
                    name="dataNascimento"
                    placeholder="Digite sua data de nascimento"
                    matInput
                  />
                </mat-form-field>
              </div>
            </div>
          </div>
        </mat-card-content>
        <mat-card-actions class="m-0! flex gap-2 px-4! pb-4!">
          <button mat-flat-button color="primary" type="submit">
            <mat-icon fontIcon="save"> </mat-icon>
            Salvar
          </button>
          <button mat-flat-button color="primary">
            <mat-icon fontIcon="refresh"> </mat-icon>
            Atualizar
          </button>
          <button mat-flat-button color="accent">
            <mat-icon fontIcon="backspace"> </mat-icon>
            Limpar
          </button>
        </mat-card-actions>
      </mat-card>
    </form>
  </div>
</div>
